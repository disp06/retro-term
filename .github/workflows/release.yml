name: Release

# When the release notes (or this workflow) change on main, build the APK and publish
# GitHub Release v<versionName> with the notes from .github/release-notes/v<versionName>.md.
# To ship a new version: bump versionName in app/build.gradle.kts, add the matching notes file, push.
on:
  push:
    branches: [ main ]
    paths:
      - '.github/release-notes/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "RetroTerm-${{ steps.ver.outputs.v }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: RETRO-TERM ${{ steps.ver.outputs.v }}
          body_path: .github/release-notes/v${{ steps.ver.outputs.v }}.md
          files: RetroTerm-${{ steps.ver.outputs.v }}.apk
          make_latest: true
